# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#              双日 AI + 中国篮球关注简报配置
# ═══════════════════════════════════════════════════════════════

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  # 与当前附件任务调度保持一致。
  # 附件本身仍标记“是否统一北京时间”为待人工确认事项。
  timezone: "Asia/Shanghai"
  show_version_update: true

# ===============================================================
# 1.5 调度系统
#
# 双日调度由 .github/workflows/crawler.yml 控制，
# 因此这里关闭 TrendRadar 自身 timeline 调度。
#
# crawler 仍每小时采集，
# AI_ANALYSIS_ENABLED 只在双日简报运行时被 workflow 打开。
# ===============================================================
schedule:
  enabled: false
  preset: "morning_evening"

# ===============================================================
# 2. 热榜平台
# ===============================================================
platforms:
  enabled: true
  api_url: ""

  sources:
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"

    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"

    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"

    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
      expected_domain: "bilibili.com"

    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"

    - id: "tieba"
      name: "贴吧"
      expected_domain: "baidu.com"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"

    - id: "douyin"
      name: "抖音"
      expected_domain: "douyin.com"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"

# ===============================================================
# 3. RSS
#
# RSS 是附件“官方一手优先”能够在 TrendRadar 原生结构中
# 最接近实现的一层。
#
# max_age_days=7 是为了允许票务专项观察最近7天内容；
# 最终 Prompt 会区分：
#   主新闻目标窗口 = 48小时
#   票务窗口       = 7天
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 7

  feeds:
    # A级：OpenAI 官方
    - id: "openai-news"
      name: "OpenAI Official"
      url: "https://openai.com/news/rss.xml"
      max_age_days: 7

    # A级：Google DeepMind 官方
    - id: "deepmind-blog"
      name: "Google DeepMind Official"
      url: "https://deepmind.google/blog/rss.xml"
      max_age_days: 7

    # A级：NVIDIA Developer Blog
    - id: "nvidia-developer"
      name: "NVIDIA Developer Blog"
      url: "https://developer.nvidia.com/blog/feed/"
      max_age_days: 7

    # C级：专业科技媒体
    - id: "theverge-ai"
      name: "The Verge AI"
      url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
      max_age_days: 7

    # C级：专业科技媒体
    - id: "techcrunch-ai"
      name: "TechCrunch AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      max_age_days: 7

# ===============================================================
# 4. 报告模式
#
# TrendRadar 原生不存在 rolling 48h 报告模式。
# daily 是目前最完整的原生累计模式。
#
# Prompt 会明确禁止把“daily 数据”伪称为已完整覆盖过去48小时。
# ===============================================================
report:
  mode: "daily"

  display_mode: "keyword"

  # 按配置关注顺序排序，避免纯热度把重要但冷门事件压后。
  sort_by_position_first: true

  rank_threshold: 5

  # 不裁剪单个关键词新闻，避免赛事/官宣漏项。
  max_news_per_keyword: 0

# ===============================================================
# 4.5 筛选策略
#
# 主筛选：AI
# 失败兜底：frequency_words.txt
# ===============================================================
filter:
  method: "ai"
  priority_sort_enabled: true

# ===============================================================
# 4.6 AI 智能筛选
# ===============================================================
ai_filter:
  batch_size: 200
  batch_interval: 2

  # 为降低漏检风险，比默认值适当降低。
  # 这是适配附件“宁可标记缺口，不要因为热度低漏掉”的工程参数。
  min_score: 0.55

  reclassify_threshold: 0.6

  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ===============================================================
# 5. 显示内容
# ===============================================================
display:
  region_order:
    - new_items
    - hotlist
    - rss
    - standalone
    - ai_analysis

  regions:
    hotlist: true
    new_items: true
    rss: true
    standalone: false
    ai_analysis: true

  standalone:
    platforms: []
    rss_feeds: []
    max_items: 0

# ===============================================================
# 6. 通知
#
# 与附件当前任务状态一致：
# notifications_enabled = false
# email_enabled         = false
#
# 如以后需要飞书/邮件推送，再改为 true。
# ===============================================================
notification:
  enabled: false

  channels:
    feishu:
      webhook_url: ""

    dingtalk:
      webhook_url: ""

    wework:
      webhook_url: ""
      msg_type: "markdown"

    telegram:
      bot_token: ""
      chat_id: ""

    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""

    slack:
      webhook_url: ""

    generic_webhook:
      webhook_url: ""
      payload_template: ""

# ===============================================================
# 7. 存储
#
# GitHub Actions 模式建议务必配置 S3/R2。
# 否则跨小时、跨日累计数据能力会受到限制。
# ===============================================================
storage:
  backend: "auto"

  formats:
    sqlite: true
    txt: true
    html: true

  local:
    data_dir: "output"
    retention_days: 0

  remote:
    retention_days: 0

    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""

  pull:
    enabled: false
    days: 7

# ===============================================================
# 8. AI 模型
#
# GitHub Actions 中 AI_MODEL / AI_API_KEY Secret 可覆盖这里。
# ===============================================================
ai:
  model: "deepseek/deepseek-v4-flash"

  api_key: ""

  api_base: ""

  timeout: 180

  # 为双日长简报预留更大输出空间。
  temperature: 1.0
  max_tokens: 8000

  num_retries: 2

  fallback_models: []

# ===============================================================
# 9. AI 分析
# ===============================================================
ai_analysis:
  enabled: true

  language: "Chinese"

  prompt_file: "ai_analysis_prompt.txt"

  # TrendRadar 当前原生最接近完整累计的模式。
  mode: "daily"

  # 附件建议 AI 2-5条、篮球4-10条，
  # 但为了发现弱信号和赛果，不把输入限制得过低。
  max_news_for_analysis: 300

  include_rss: true
  include_standalone: false

  include_rank_timeline: true

# ===============================================================
# 10. AI 翻译
#
# 分析模型本身可阅读英文，默认关闭额外翻译以降低 Token 消耗。
# ===============================================================
ai_translation:
  enabled: false

  language: "中文"

  prompt_file: "ai_translation_prompt.txt"

  batch_size: 100
  batch_interval: 2

  scope:
    hotlist: false
    rss: false
    standalone: false

# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""

  # 更偏重“持续出现/持续更新”，弱化单次排名。
  weight:
    rank: 0.4
    frequency: 0.5
    hotness: 0.1

  max_accounts_per_channel: 3

  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000

  batch_send_interval: 3

  feishu_message_separator: "━━━━━━━━━━━━━━━━"
